<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <style>
      .favicon-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; }
      .favicon-line { fill: #1F2937; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="180" height="180" fill="url(#bgGrad)" rx="40"/>
  
  <!-- Main content group - centered -->
  <g transform="translate(90, 90)">
    <!-- Top line (full width, centered) -->
    <rect x="-50" y="-40" width="100" height="3" class="favicon-line" rx="1.5"/>
    
    <!-- 24R text (centered with proper spacing from top line) -->
    <text x="-15" y="18" font-size="68" class="favicon-text" fill="#1F2937" text-anchor="middle">24R</text>
    
    <!-- Bottom line (inset, centered, ends before x) -->
    <rect x="-50" y="35" width="72" height="3" class="favicon-line" rx="1.5"/>
    
    <!-- x subscript (positioned to the right of R, aligned with bottom line) -->
    <text x="38" y="32" font-size="32" class="favicon-text" fill="#1F2937" text-anchor="middle">x</text>
  </g>
  
  <!-- Subtle shine effect -->
  <rect width="180" height="180" fill="white" opacity="0.05" rx="40"/>
</svg>
