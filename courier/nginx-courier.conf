# Nginx configuration for Courier Dashboard
# Domain: track.24rxexchange.in

server {
    listen 80;
    listen [::]:80;
    server_name track.24rxexchange.in;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name track.24rxexchange.in;

    # SSL Configuration (will be managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/track.24rxexchange.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.24rxexchange.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory
    root /home/admin_24rx/24rx/courier;
    index index.html;

    # Logging
    access_log /var/log/nginx/courier-access.log;
    error_log /var/log/nginx/courier-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.svg {
        log_not_found off;
        access_log off;
    }
}
