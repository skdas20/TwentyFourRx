name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/admin_24rx/24rx/frontend
            git pull origin main
            npm install
            npm run build
            sudo systemctl restart 24rx-frontend

      - name: Check Frontend Status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl status 24rx-frontend --no-pager

      - name: Notify Success
        if: success()
        run: echo "✅ Frontend deployed successfully!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Frontend deployment failed!"
